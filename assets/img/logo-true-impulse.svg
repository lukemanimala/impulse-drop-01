<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- TRUE IMPULSE stacked with geometry -->

  <!-- Geometry centered top -->
  <g transform="translate(50, 32)">
    <polygon points="0,-18 16,9 -16,9" fill="none" stroke="#1a1a1a" stroke-width="0.9" transform="rotate(-6)"/>
    <polygon points="0,-14 12,7 -12,7" fill="none" stroke="#2a2a2a" stroke-width="0.8" transform="rotate(2)"/>
    <polygon points="0,-10 9,5 -9,5" fill="none" stroke="#3a3a3a" stroke-width="0.7" transform="rotate(12)"/>
    <polygon points="0,-6 5,3 -5,3" fill="none" stroke="#4a4a4a" stroke-width="0.6" transform="rotate(24)"/>
  </g>

  <!-- TRUE -->
  <text
    x="50"
    y="64"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="8"
    font-weight="300"
    letter-spacing="0.5em"
    fill="#888888"
  >TRUE</text>

  <!-- IMPULSE -->
  <text
    x="50"
    y="78"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="0.3em"
    fill="#1a1a1a"
  >IMPULSE</text>
</svg>