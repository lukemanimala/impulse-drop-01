<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>True Impulse Drop 01 - Preview</title>
    <link rel="stylesheet" href="assets/css/drop-01.css">
    <style>
        /* Preview-specific overrides - LIGHT THEME */
        * { margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #fff;
        }
        .screen-reader-text {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        /* Override dark theme from main CSS */
        .tid-drop {
            background: #fff !important;
            color: #000 !important;
        }

        .tid-loading {
            background: #fff !important;
            transition: opacity 0.8s ease-out !important;
        }

        .tid-loading__wordmark {
            color: #000 !important;
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .tid-drop[data-state="field"] .tid-loading__wordmark,
        .tid-drop[data-state="formation"] .tid-loading__wordmark {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Loading logo SVG */
        .tid-loading__logo {
            margin-top: 24px;
            animation: logoSpin 4s linear infinite;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .tid-loading__logo svg {
            display: block;
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.7); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .tid-drop[data-state="field"] .tid-loading__logo,
        .tid-drop[data-state="formation"] .tid-loading__logo {
            opacity: 0;
            transform: scale(1.5) rotate(180deg);
            animation: none;
        }

        /* Three.js canvas container */
        .tid-field-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* Big drop number overlay */
        .tid-drop-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            z-index: 1;
            user-select: none;
            transition: opacity 0.6s ease-out;
            line-height: 0.85;
        }

        .tid-drop-number__label {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 400;
            letter-spacing: 0.3em;
        }

        .tid-drop-number__value {
            font-size: clamp(180px, 35vw, 420px);
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        /* Hide drop number after field state */
        .tid-drop[data-state="formation"] .tid-drop-number,
        .tid-drop[data-state="reveal"] .tid-drop-number {
            opacity: 0;
        }

        /* Custom cursor - MATERIALIZE label */
        .tid-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            background: #000;
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .tid-cursor::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 33px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .tid-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -8px;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 0 2px #fff;
        }

        .tid-cursor.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: cursorPulse 2s ease-in-out infinite;
        }

        .tid-cursor.active::before {
            opacity: 1;
        }

        @keyframes cursorPulse {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            }
            50% {
                box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            }
        }

        /* Hide default cursor over field when custom cursor is active */
        .tid-drop[data-state="field"] .tid-field-container {
            cursor: none;
        }

        .tid-drop[data-state="field"] {
            cursor: none;
        }

        /* Touch devices - show floating tap button */
        @media (hover: none) and (pointer: coarse) {
            .tid-cursor {
                /* Override cursor-following behavior - make it fixed center-bottom */
                position: fixed !important;
                bottom: 140px !important;
                left: 50% !important;
                top: auto !important;
                transform: translateX(-50%) !important;
                opacity: 0;
                pointer-events: none;
            }

            .tid-cursor.active {
                opacity: 1;
                transform: translateX(-50%) !important;
                animation: floatPulse 2s ease-in-out infinite;
            }

            .tid-cursor::after {
                display: none;
            }

            @keyframes floatPulse {
                0%, 100% {
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                    transform: translateX(-50%) translateY(0);
                }
                50% {
                    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
                    transform: translateX(-50%) translateY(-5px);
                }
            }

            .tid-drop[data-state="field"] .tid-field-container {
                cursor: pointer;
            }
        }

        /* Hide original button completely */
        .tid-materialize-btn {
            display: none !important;
        }

        /* Purchase tray - light theme */
        .tid-purchase-tray {
            background: rgba(255,255,255,0.95) !important;
            border-top: 1px solid #e0e0e0 !important;
            backdrop-filter: blur(10px);
        }

        .tid-purchase-tray__toggle {
            color: #000 !important;
        }

        .tid-purchase-tray__price {
            color: #666 !important;
        }

        .tid-purchase-tray__expand-icon {
            border-color: #666 !important;
        }

        .tid-size-btn {
            background: #fff !important;
            border: 1px solid #ccc !important;
            color: #000 !important;
        }

        .tid-size-btn:hover:not(:disabled) {
            border-color: #000 !important;
        }

        .tid-size-btn[aria-checked="true"] {
            background: #000 !important;
            border-color: #000 !important;
            color: #fff !important;
        }

        .tid-size-btn--sold-out {
            color: #999 !important;
            border-color: #e0e0e0 !important;
        }

        .tid-btn--primary {
            background: #000 !important;
            color: #fff !important;
        }

        .tid-btn--primary:hover:not(:disabled) {
            background: #333 !important;
        }

        .tid-btn--primary:disabled {
            background: #e0e0e0 !important;
            color: #999 !important;
        }

        /* Product reveal layer */
        .tid-product-reveal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            background: #fff;
        }

        .tid-drop[data-state="reveal"] .tid-product-reveal,
        .tid-drop[data-state="detail"] .tid-product-reveal,
        .tid-drop[data-state="purchase"] .tid-product-reveal {
            opacity: 1;
            pointer-events: auto;
        }

        .tid-product-image {
            position: relative;
            width: 100vw;
            max-width: 2016px;
            height: 100vh;
            max-height: 2352px;
            background: #fff;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .tid-product-image img {
            display: block;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* Video container */
        .tid-product-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.6s ease;
            background: #fff;
        }

        .tid-product-video.active {
            opacity: 1;
            pointer-events: auto;
        }

        .tid-product-video video {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* View toggle */
        .tid-view-toggle {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        /* Mobile - move above images */
        @media (max-width: 768px) {
            .tid-view-toggle {
                bottom: auto;
                top: 20px;
            }
        }

        .tid-view-toggle button {
            padding: 12px 20px;
            background: #fff;
            border: 1px solid #ccc;
            color: #333;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .tid-view-toggle button:hover,
        .tid-view-toggle button.active {
            background: #000;
            border-color: #000;
            color: #fff;
        }
    </style>
</head>

<script>
console.log('=== TRUE IMPULSE DROP SCRIPT LOADED ===');
console.log('THREE available:', typeof THREE !== 'undefined');
console.log('gsap available:', typeof gsap !== 'undefined');

(function() {
    'use strict';

    // Debug logging
    const DEBUG = true;
    const log = (...args) => {
        console.log('[TID]', ...args);
    };

    const STATES = {
        LOADING: 'loading',
        FIELD: 'field',
        FORMATION: 'formation',
        REVEAL: 'reveal',
        DETAIL: 'detail',
        PURCHASE: 'purchase'
    };

    class DropController {
        constructor() {
            log('DropController initializing...');
            this.state = STATES.LOADING;
            this.proceduralField = null;
            this.selectedVariation = null;
            this.isAddingToCart = false;
            this.config = window.tidConfig || {};

            this.elements = {};
            this.init();
        }

        init() {
            log('init() called');
            this.cacheElements();
            this.bindEvents();
            this.loadExperience();
        }

        cacheElements() {
            this.elements = {
                drop: document.getElementById('tid-drop'),
                fieldContainer: document.getElementById('tid-field-container'),
                materializeBtn: document.getElementById('tid-materialize-btn'),
                cursor: document.getElementById('tid-cursor'),
                productReveal: document.querySelector('.tid-product-reveal'),
                productContainer: document.getElementById('tid-product-container'),
                productFront: document.getElementById('tid-product-front'),
                productBack: document.getElementById('tid-product-back'),
                productVideo: document.getElementById('tid-product-video'),
                rotationVideo: document.getElementById('tid-rotation-video'),
                viewToggle: document.getElementById('tid-view-toggle'),
                purchaseTray: document.getElementById('tid-purchase-tray'),
                trayToggle: document.querySelector('.tid-purchase-tray__toggle'),
                sizeButtons: document.querySelectorAll('.tid-size-btn'),
                addToCartBtn: document.getElementById('tid-add-to-cart'),
                cartError: document.getElementById('tid-cart-error')
            };
            log('Elements cached:', {
                drop: !!this.elements.drop,
                fieldContainer: !!this.elements.fieldContainer,
                materializeBtn: !!this.elements.materializeBtn,
                productReveal: !!this.elements.productReveal,
                productContainer: !!this.elements.productContainer,
                productFront: !!this.elements.productFront,
                productBack: !!this.elements.productBack,
                productVideo: !!this.elements.productVideo,
                rotationVideo: !!this.elements.rotationVideo,
                viewToggle: !!this.elements.viewToggle
            });
        }

        bindEvents() {
            log('bindEvents() called');

            // Custom cursor tracking
            if (this.elements.cursor) {
                this.cursorTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                this.cursorPos = { x: this.cursorTarget.x, y: this.cursorTarget.y };

                window.addEventListener('mousemove', (e) => {
                    this.cursorTarget.x = e.clientX;
                    this.cursorTarget.y = e.clientY;
                });

                // Smooth cursor animation
                const animateCursor = () => {
                    // Smooth interpolation
                    this.cursorPos.x += (this.cursorTarget.x - this.cursorPos.x) * 0.15;
                    this.cursorPos.y += (this.cursorTarget.y - this.cursorPos.y) * 0.15;

                    this.elements.cursor.style.left = this.cursorPos.x + 'px';
                    this.elements.cursor.style.top = this.cursorPos.y + 'px';

                    // Show cursor only in FIELD state
                    if (this.state === STATES.FIELD) {
                        this.elements.cursor.classList.add('active');
                    } else {
                        this.elements.cursor.classList.remove('active');
                    }

                    requestAnimationFrame(animateCursor);
                };
                animateCursor();
            }

            // Click on field to materialize
            if (this.elements.fieldContainer) {
                this.elements.fieldContainer.addEventListener('click', () => {
                    if (this.state === STATES.FIELD) {
                        log('Field clicked - materializing');
                        this.materialize();
                    }
                });
            }

            // Materialize button (accessibility fallback)
            if (this.elements.materializeBtn) {
                this.elements.materializeBtn.addEventListener('click', () => {
                    log('Materialize button clicked');
                    this.materialize();
                });
            }

            // Purchase tray toggle
            if (this.elements.trayToggle) {
                this.elements.trayToggle.addEventListener('click', () => this.togglePurchaseTray());
            }

            // Size selection
            this.elements.sizeButtons.forEach(btn => {
                btn.addEventListener('click', () => this.selectSize(btn));
            });

            // Add to cart
            if (this.elements.addToCartBtn) {
                this.elements.addToCartBtn.addEventListener('click', () => this.addToCart());
            }

            // View toggle buttons
            if (this.elements.viewToggle) {
                const buttons = this.elements.viewToggle.querySelectorAll('button');
                log('View toggle buttons found:', buttons.length);
                buttons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        log('View toggle clicked:', btn.dataset.view);
                        this.switchView(btn.dataset.view);
                    });
                });
            } else {
                log('WARNING: viewToggle element not found!');
            }

            // Product image interaction
            if (this.elements.productContainer) {
                this.elements.productContainer.addEventListener('click', (e) => {
                    if (e.target.tagName === 'IMG') {
                        this.createImageRipple(e);
                    }
                });
            }
        }

        async loadExperience() {
            log('loadExperience() called');
            log('ProceduralField available:', !!window.ProceduralField);

            try {
                // Initialize procedural field
                if (this.elements.fieldContainer && window.ProceduralField) {
                    log('Creating ProceduralField...');
                    this.proceduralField = new window.ProceduralField(this.elements.fieldContainer);
                    this.proceduralField.start();
                    log('ProceduralField started');
                } else {
                    log('WARNING: Cannot create ProceduralField', {
                        fieldContainer: !!this.elements.fieldContainer,
                        ProceduralField: !!window.ProceduralField
                    });
                }

                // Brief loading delay for pyramid animation
                await this.delay(1500);

                // Transition: set state first (triggers CSS fade)
                this.setState(STATES.FIELD);
                log('State set to FIELD');

            } catch (error) {
                console.error('Failed to initialize:', error);
                this.setState(STATES.REVEAL); // Fallback to product view
            }
        }

        setState(newState) {
            log('setState:', this.state, '->', newState);
            this.state = newState;
            if (this.elements.drop) {
                this.elements.drop.dataset.state = newState;
            }
        }

        materialize() {
            log('materialize() called, current state:', this.state);
            if (this.state !== STATES.FIELD) {
                log('Cannot materialize - not in FIELD state');
                return;
            }

            this.setState(STATES.FORMATION);

            if (this.proceduralField) {
                log('Starting procedural reveal...');
                this.proceduralField.startReveal(() => {
                    log('Procedural reveal complete callback');
                    this.onRevealComplete();
                });
            } else {
                log('No procedural field, using timeout fallback');
                setTimeout(() => this.onRevealComplete(), 300);
            }
        }

        onRevealComplete() {
            log('onRevealComplete() called');
            this.setState(STATES.REVEAL);

            // Remove aria-hidden from product reveal
            if (this.elements.productReveal) {
                this.elements.productReveal.setAttribute('aria-hidden', 'false');
                log('Set productReveal aria-hidden to false');
            }

            // Show view toggle
            if (this.elements.viewToggle) {
                log('Showing view toggle');
                this.elements.viewToggle.style.display = 'flex';
            } else {
                log('WARNING: viewToggle not available in onRevealComplete');
            }

            // Expand purchase tray
            if (this.elements.trayToggle) {
                this.elements.trayToggle.setAttribute('aria-expanded', 'true');
            }

            // Animate product in with GSAP
            if (window.gsap && this.elements.productReveal) {
                gsap.fromTo(this.elements.productReveal,
                    { opacity: 0 },
                    { opacity: 1, duration: 1.2, ease: 'power2.out' }
                );
            }
        }

        switchView(view) {
            log('switchView() called with:', view);
            log('Elements state:', {
                viewToggle: !!this.elements.viewToggle,
                productFront: !!this.elements.productFront,
                productBack: !!this.elements.productBack,
                productVideo: !!this.elements.productVideo,
                rotationVideo: !!this.elements.rotationVideo
            });

            if (!this.elements.viewToggle) {
                log('ERROR: viewToggle not found');
                return;
            }

            // Update toggle buttons
            this.elements.viewToggle.querySelectorAll('button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });

            // Hide all views
            if (this.elements.productFront) {
                this.elements.productFront.style.display = 'none';
                log('Hid productFront');
            }
            if (this.elements.productBack) {
                this.elements.productBack.style.display = 'none';
                log('Hid productBack');
            }
            if (this.elements.productVideo) {
                this.elements.productVideo.classList.remove('active');
                log('Removed active from productVideo');
            }

            // Pause video
            if (this.elements.rotationVideo) {
                this.elements.rotationVideo.pause();
            }

            // Show selected view
            switch (view) {
                case 'front':
                    if (this.elements.productFront) {
                        this.elements.productFront.style.display = 'block';
                        log('Showing front view');
                    }
                    break;
                case 'back':
                    if (this.elements.productBack) {
                        this.elements.productBack.style.display = 'block';
                        log('Showing back view');
                    }
                    break;
                case 'video':
                    if (this.elements.productVideo) {
                        this.elements.productVideo.classList.add('active');
                        log('Showing video view');
                    }
                    if (this.elements.rotationVideo) {
                        log('Attempting to play video, src:', this.elements.rotationVideo.src);
                        this.elements.rotationVideo.play()
                            .then(() => log('Video playing'))
                            .catch(err => log('Video play error:', err.message));
                    }
                    break;
            }
        }

        createImageRipple(e) {
            // Create a ripple effect on the product image
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement('div');
            ripple.style.cssText = `
                position: absolute;
                left: ${x}px;
                top: ${y}px;
                width: 0;
                height: 0;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, transparent 70%);
                transform: translate(-50%, -50%);
                pointer-events: none;
            `;

            this.elements.productContainer.style.position = 'relative';
            this.elements.productContainer.appendChild(ripple);

            if (window.gsap) {
                gsap.to(ripple, {
                    width: 300,
                    height: 300,
                    opacity: 0,
                    duration: 0.8,
                    ease: 'power2.out',
                    onComplete: () => ripple.remove()
                });
            } else {
                setTimeout(() => ripple.remove(), 800);
            }
        }

        togglePurchaseTray() {
            const toggle = this.elements.trayToggle;
            if (!toggle) return;

            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';
            toggle.setAttribute('aria-expanded', !isExpanded);
        }

        selectSize(button) {
            if (button.disabled) return;

            this.elements.sizeButtons.forEach(btn => {
                btn.setAttribute('aria-checked', 'false');
            });
            button.setAttribute('aria-checked', 'true');

            this.selectedVariation = {
                id: parseInt(button.dataset.variationId, 10),
                size: button.dataset.size
            };

            const addBtn = this.elements.addToCartBtn;
            if (addBtn) {
                addBtn.disabled = false;
                addBtn.querySelector('.tid-btn__text').textContent = this.config.i18n?.add_to_cart || 'Add to Cart';
            }
        }

        async addToCart() {
            if (!this.selectedVariation || this.isAddingToCart) return;

            const addBtn = this.elements.addToCartBtn;
            if (!addBtn) return;

            this.isAddingToCart = true;
            addBtn.classList.add('loading');

            // Simulate cart add
            await this.delay(800);

            addBtn.querySelector('.tid-btn__text').textContent = this.config.i18n?.added || 'Added!';
            addBtn.classList.remove('loading');

            // Redirect after brief confirmation
            setTimeout(() => {
                alert('Demo mode: Would redirect to checkout');
            }, 600);

            this.isAddingToCart = false;
        }

        delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    }

    // Initialize
    console.log('[TID] Document readyState:', document.readyState);
    if (document.readyState === 'loading') {
        console.log('[TID] Waiting for DOMContentLoaded...');
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[TID] DOMContentLoaded fired, creating DropController');
            window.dropController = new DropController();
        });
    } else {
        console.log('[TID] DOM already ready, creating DropController now');
        window.dropController = new DropController();
    }
    console.log('[TID] Script initialization complete');
})();
</script>
